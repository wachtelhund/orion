[workspace]
resolver = "2"
members = ["crates/sim", "crates/client"]

[workspace.package]
edition = "2021"
version = "0.23.0"
license = "MIT OR Apache-2.0"

[profile.release]
opt-level = 3
lto = "thin"

# Fast iteration: keep dependencies optimized even in dev builds so the
# renderer and sim are usable without --release during development.
[profile.dev.package."*"]
opt-level = 2
