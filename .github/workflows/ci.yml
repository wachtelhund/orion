name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test + soak
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System deps (audio)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Tests (incl. determinism, lockstep, small soak)
        run: cargo test --workspace --release
      - name: Gameplay soak (8 games, invariants + shadow determinism)
        run: cargo run --release -p orion-sim --example soak -- 8
      - name: Pathfinding stress budget
        run: cargo run --release -p orion-sim --example stress

  # Cross-platform client builds run on release tags only (release.yml).
  # Private-repo Actions minutes bill macOS at 10x and Windows at 2x — a
  # 3-OS matrix on every push burned the whole monthly allowance in days
  # (learned 2026-08-05, at the cost of a billing lockout). Linux at 1x
  # keeps a client compile check on every push.
  build:
    name: Build linux client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System deps (audio)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cargo build --release -p orion-client
