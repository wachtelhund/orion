name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test + soak
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System deps (audio)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Tests (incl. determinism, lockstep, small soak)
        run: cargo test --workspace --release
      - name: Gameplay soak (8 games, invariants + shadow determinism)
        run: cargo run --release -p orion-sim --example soak -- 8
      - name: Pathfinding stress budget
        run: cargo run --release -p orion-sim --example stress

  build:
    name: Build ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System deps (audio)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cargo build --release -p orion-client
