name: Release

# Manual only: run from the Actions tab (or `gh workflow run`) with the
# tag to build and checkboxes for which platforms. Tag pushes deliberately
# do not trigger builds — releasing stays a human decision.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and attach assets to (e.g. v0.20.1)"
        required: true
        type: string
      build_macos:
        description: "macOS universal"
        type: boolean
        default: true
      build_linux:
        description: "Linux x86_64"
        type: boolean
        default: true
      build_windows:
        description: "Windows x86_64"
        type: boolean
        default: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # The checkboxes pick the platforms; workflow_dispatch booleans cannot
  # gate matrix entries directly, so a cheap Linux job assembles the
  # matrix from them.
  plan:
    name: Plan builds
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        run: |
          m='[]'
          if [ "${{ inputs.build_macos }}" = "true" ]; then
            m=$(echo "$m" | jq -c '. + [{"name":"macos-universal","os":"macos-14","artifact":"Orion-macOS.zip"}]')
          fi
          if [ "${{ inputs.build_linux }}" = "true" ]; then
            m=$(echo "$m" | jq -c '. + [{"name":"linux-x86_64","os":"ubuntu-22.04","artifact":"orion-linux-x86_64.tar.gz"}]')
          fi
          if [ "${{ inputs.build_windows }}" = "true" ]; then
            m=$(echo "$m" | jq -c '. + [{"name":"windows-x86_64","os":"windows-latest","artifact":"orion-windows-x86_64.zip"}]')
          fi
          echo "matrix=$m" >> "$GITHUB_OUTPUT"
          echo "building: $m"

  build:
    name: ${{ matrix.name }}
    needs: plan
    if: needs.plan.outputs.matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: System deps (audio)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Build (macOS universal .app)
        if: matrix.name == 'macos-universal'
        run: |
          rustup target add x86_64-apple-darwin aarch64-apple-darwin
          cargo build --release -p orion-client --target aarch64-apple-darwin
          cargo build --release -p orion-client --target x86_64-apple-darwin
          APP="dist/Orion.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          lipo -create \
            target/aarch64-apple-darwin/release/orion-client \
            target/x86_64-apple-darwin/release/orion-client \
            -output "$APP/Contents/MacOS/orion"
          cp crates/client/assets/mac/Info.plist "$APP/Contents/Info.plist"
          # App icon: generated on the runner from a committed screenshot.
          sips --cropToHeightWidth 760 760 docs/media/battle.png --out icon.png
          mkdir -p Orion.iconset
          for sz in 16 32 64 128 256 512; do
            sips -z $sz $sz icon.png --out Orion.iconset/icon_${sz}x${sz}.png
            sips -z $((sz*2)) $((sz*2)) icon.png --out Orion.iconset/icon_${sz}x${sz}@2x.png
          done
          iconutil -c icns Orion.iconset -o "$APP/Contents/Resources/orion.icns"
          # Ad-hoc signature: without this, arm64 Macs refuse to launch at all.
          codesign --force --deep -s - "$APP"
          ditto -c -k --keepParent "$APP" ${{ matrix.artifact }}

      - name: Build (Linux)
        if: matrix.name == 'linux-x86_64'
        run: |
          cargo build --release -p orion-client
          mkdir -p dist
          cp target/release/orion-client dist/orion
          cp README.md dist/
          tar czf ${{ matrix.artifact }} -C dist orion README.md

      - name: Build (Windows)
        if: matrix.name == 'windows-x86_64'
        shell: pwsh
        run: |
          cargo build --release -p orion-client
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/orion-client.exe dist/orion.exe
          Copy-Item README.md dist/
          Compress-Archive -Path dist/orion.exe, dist/README.md -DestinationPath ${{ matrix.artifact }}

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: ${{ matrix.artifact }}
          generate_release_notes: true
