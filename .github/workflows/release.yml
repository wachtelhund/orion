name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-universal
            os: macos-14
            artifact: orion-macos-universal.tar.gz
          - name: linux-x86_64
            os: ubuntu-22.04
            artifact: orion-linux-x86_64.tar.gz
          - name: windows-x86_64
            os: windows-latest
            artifact: orion-windows-x86_64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: System deps (audio)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Build (macOS universal)
        if: matrix.name == 'macos-universal'
        run: |
          rustup target add x86_64-apple-darwin aarch64-apple-darwin
          cargo build --release -p orion-client --target aarch64-apple-darwin
          cargo build --release -p orion-client --target x86_64-apple-darwin
          mkdir -p dist
          lipo -create \
            target/aarch64-apple-darwin/release/orion-client \
            target/x86_64-apple-darwin/release/orion-client \
            -output dist/orion
          cp README.md dist/
          tar czf ${{ matrix.artifact }} -C dist orion README.md

      - name: Build (Linux)
        if: matrix.name == 'linux-x86_64'
        run: |
          cargo build --release -p orion-client
          mkdir -p dist
          cp target/release/orion-client dist/orion
          cp README.md dist/
          tar czf ${{ matrix.artifact }} -C dist orion README.md

      - name: Build (Windows)
        if: matrix.name == 'windows-x86_64'
        shell: pwsh
        run: |
          cargo build --release -p orion-client
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/orion-client.exe dist/orion.exe
          Copy-Item README.md dist/
          Compress-Archive -Path dist/orion.exe, dist/README.md -DestinationPath ${{ matrix.artifact }}

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}
          generate_release_notes: true
