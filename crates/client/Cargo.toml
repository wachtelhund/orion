[package]
name = "orion-client"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
orion-sim = { path = "../sim" }
winit = "0.30"
wgpu = "24"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
env_logger = "0.11"
log = "0.4"
serde = { version = "1", features = ["derive"] }
ron = "0.8"
rodio = { version = "0.19", default-features = false }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
tungstenite = { version = "0.23", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
rodio = { version = "0.19", default-features = false, features = ["wasm-bindgen"] }
getrandom = { version = "0.2", features = ["js"] }
web-time = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = ["Document", "Window", "Element", "HtmlCanvasElement", "CssStyleDeclaration", "console", "WebSocket", "MessageEvent", "BinaryType", "Performance", "Storage", "Response", "Location"] }
